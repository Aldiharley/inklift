name: Bundle

# Tauri cannot cross-bundle: a .dmg needs macOS and a .msi needs Windows, so
# each platform is built on its own runner. Free for public repositories.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  bundle:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # one binary covering both Apple architectures
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          # the oldest supported runner, so the glibc it links is the oldest
          # a user is likely to have
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
          - platform: windows-latest
            args: ""
            rust-targets: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # WebKitGTK for the webview, appindicator for the tray, patchelf for the
      # AppImage. These are the Tauri v2 Linux prerequisites.
      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # Tag pushes publish a draft release; everything else just leaves the
      # bundles as downloadable artifacts.
      - name: Bundle and draft a release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/inklift-gui
          tagName: ${{ github.ref_name }}
          releaseName: "inklift ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Bundle only
        if: "!startsWith(github.ref, 'refs/tags/')"
        id: build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/inklift-gui
          args: ${{ matrix.args }}

      # Collect with find rather than an upload glob. The glob missed on both
      # macOS and Windows -- a universal Apple build lands under
      # target/universal-apple-darwin/, not target/ -- and the job still went
      # green because nothing had been uploaded and nothing said so.
      #
      # The listing runs first and unconditionally: when this found nothing on
      # macOS and Windows there was no way to tell from the log whether the
      # bundles were missing or the search was wrong.
      - name: Collect the bundles
        if: "!startsWith(github.ref, 'refs/tags/')"
        shell: bash
        run: |
          # Search the whole workspace, not target/. On macOS a universal build
          # left nothing under target/ at all, and because the find errors were
          # sent to /dev/null the log could not say why -- the one thing that
          # would have explained it was the thing being silenced.
          echo "pwd: $(pwd)"
          echo "--- bundle directories ---"
          find . -type d -name bundle || true
          echo "--- installers anywhere in the workspace ---"
          find . -type f \
            \( -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' \
               -o -name '*.msi' -o -name '*-setup.exe' \) || true
          mkdir -p dist
          find . -type f -path '*/release/*' \
            \( -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' \
               -o -name '*.msi' -o -name '*-setup.exe' \) \
            -exec cp {} dist/ \;
          echo "--- collected ---"
          ls -lh dist

      - name: Upload the bundles
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: inklift-${{ matrix.platform }}
          path: dist/*
          # An empty artifact is a build that produced nothing while reporting
          # success. Fail instead.
          if-no-files-found: error
