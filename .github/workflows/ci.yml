name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # `cargo test --workspace` builds the Tauri app, so the webview and tray
      # libraries have to be present even though no window is opened.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2

      # The X11 tests check for DISPLAY and skip when there is none, so the
      # headless runner exercises everything else.
      - name: Test, offline build
        run: cargo test --workspace

      - name: Test, with screen capture on
        run: cargo test --workspace --features inklift-cli/shot

      # Reported, not enforced. The remaining warnings are clippy's
      # needless_range_loop in numeric code, where the indexed form is the
      # clearer one, and `cargo fmt` would currently rewrite 241 files. Turning
      # either into a gate is the repository owner's call, not a side effect of
      # adding CI.
      - name: Clippy (advisory)
        run: cargo clippy --workspace --all-targets
        continue-on-error: true

  # Windows has its own capture backend, so it gets the whole suite on a real
  # Windows machine rather than a compile check. GitHub's Windows runners are
  # logged in to an interactive desktop, so tests/win_live.rs and
  # tests/win_pick.rs capture the real screen and drive a real drag with
  # SendInput; where there is no desktop they skip themselves.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2

      - name: Test, offline build
        run: cargo test --workspace

      - name: Test, with screen capture on
        run: cargo test --workspace --features inklift-cli/shot

  # The reason the GUI is portable at all is that each platform's capture code
  # is behind its own cfg, and a platform with no backend yet gets
  # inklift-shot's `unsupported` module instead. Nothing but a compile for each
  # platform proves that, and it is cheap, so it runs on every push.
  portability:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2

      # tauri-build compiles the app's Windows resources (icon, version info)
      # even under `cargo check`, through embed-resource, which on a non-Windows
      # host shells out to `llvm-rc` and fails with NotAttempted("llvm-rc") when
      # it is not on PATH. The runner ships LLVM only under versioned paths, so
      # point embed-resource at the newest one; its preprocessing step uses the
      # runner's gcc, which is already there.
      - name: A Windows resource compiler for tauri-build
        run: |
          rc=$(ls /usr/lib/llvm-*/bin/llvm-rc 2>/dev/null | sort -V | tail -1)
          if [ -z "$rc" ]; then
            sudo apt-get update
            sudo apt-get install -y llvm
            rc=$(command -v llvm-rc || ls /usr/lib/llvm-*/bin/llvm-rc 2>/dev/null | sort -V | tail -1)
          fi
          if [ -z "$rc" ]; then
            echo "::error::no llvm-rc found or installable; tauri-build cannot compile Windows resources"
            exit 1
          fi
          "$rc" /? | head -1
          echo "RC_x86_64_pc_windows_msvc=$rc" >> "$GITHUB_ENV"

      - name: The desktop app must still compile for Windows
        run: cargo check --target x86_64-pc-windows-msvc -p inklift-gui

  # macOS cannot be cross-checked from Linux: objc2's build scripts need the
  # Apple toolchain. Until mac.rs exists this proves the `unsupported` path
  # compiles, which is what keeps the macOS bundle building.
  portability-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: The desktop app must still compile for macOS
        run: cargo check -p inklift-gui --all-targets
