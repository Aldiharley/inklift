[package]
name = "inklift-gui"
description = "Desktop app for lifting handwriting off images."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "inklift-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
inklift-cli = { path = "../inklift-cli" }
inklift-core = { path = "../inklift-core" }
inklift-shot = { path = "../inklift-shot" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff"] }
base64 = "0.22"

[dev-dependencies]
serde_json = "1"
inklift-shot = { path = "../inklift-shot" }
image = { version = "0.25", default-features = false, features = ["png"] }

# tests/win_lifecycle.rs finds the running app's window and closes it the way
# the title bar's X does, and skips when the session is locked (RemoteDesktop).
# Already in the tree through tauri.
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
default = []
