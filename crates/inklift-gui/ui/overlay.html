<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Select a region</title>
<style>
:root{
  --accent:#4D8FBF;
  --mono:ui-monospace,"DejaVu Sans Mono","Liberation Mono",monospace;
  --ui:system-ui,"Segoe UI",Roboto,"Noto Sans",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;
  cursor:crosshair;user-select:none;-webkit-user-select:none}

/* the frozen screen, at true pixel scale */
#frame{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;
  -webkit-user-drag:none;pointer-events:none}

/* everything outside the selection is dimmed. Four panes rather than one
   overlay with a hole, so the selected area is genuinely untouched pixels
   instead of something composited back to full brightness. */
.shade{position:absolute;background:rgba(10,12,14,.55);pointer-events:none}
#top,#bottom{left:0;width:100%}
#left,#right{}

#box{position:absolute;pointer-events:none;display:none;
  outline:1px solid var(--accent);
  box-shadow:0 0 0 1px rgba(0,0,0,.55), 0 0 22px rgba(0,0,0,.35)}
#box::before,#box::after{content:"";position:absolute;background:var(--accent)}
/* corner ticks, so the edges read even over a busy desktop */
#box::before{left:-1px;top:-1px;width:13px;height:2px;box-shadow:0 11px 0 var(--accent)}
#box::after{left:-1px;top:-1px;width:2px;height:13px;box-shadow:11px 0 0 var(--accent)}

#size{position:absolute;display:none;font-family:var(--mono);font-size:11.5px;
  padding:3px 7px;border-radius:6px;background:rgba(14,17,19,.92);color:#E7ECEF;
  white-space:nowrap;pointer-events:none;box-shadow:0 0 0 1px rgba(255,255,255,.12)}

#help{position:absolute;left:50%;top:26px;transform:translateX(-50%);
  font-family:var(--ui);font-size:12.5px;padding:7px 13px;border-radius:10px;
  background:rgba(14,17,19,.86);color:#E7ECEF;pointer-events:none;
  box-shadow:0 0 0 1px rgba(255,255,255,.12),0 8px 22px -6px rgba(0,0,0,.5)}
#help b{color:#9FC6E0;font-weight:600}
#help.gone{opacity:0;transition:opacity 160ms}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
  <img id="frame" alt="">
  <div class="shade" id="top"></div>
  <div class="shade" id="bottom"></div>
  <div class="shade" id="left"></div>
  <div class="shade" id="right"></div>
  <div id="box"></div>
  <div id="size"></div>
  <div id="help">Drag a box around the handwriting &nbsp;·&nbsp; <b>Esc</b> cancels</div>
<script src="overlay.js"></script>
</body>
</html>
