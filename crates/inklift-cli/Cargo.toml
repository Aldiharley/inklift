[package]
name = "inklift-cli"
description = "Command-line handwriting ink extractor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "inklift_cli"
path = "src/lib.rs"

[[bin]]
name = "inklift"
path = "src/main.rs"

[features]
# Offline by default: without this, no HTTP client is linked into the binary
# at all, and the hosted flags are refused rather than silently ignored.
default = []
api = ["dep:inklift-api"]
shot = ["dep:inklift-shot"]
inklift-shot = ["dep:inklift-shot"]

[dependencies]
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg"] }
inklift-api = { version = "0.1.0", path = "../inklift-api", optional = true }
inklift-core = { path = "../inklift-core" }
inklift-shot = { version = "0.1.0", path = "../inklift-shot", optional = true }

[dev-dependencies]
arboard = "3.6.1"
