[package]
name = "inklift-shot"
description = "Screen capture and interactive region selection for inklift."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
arboard = "3.6.1"
inklift-core = { version = "0.1.0", path = "../inklift-core" }
x11rb = { version = "0.14.0", features = ["randr"] }

[dev-dependencies]
# xtest drives a real pointer drag in tests/live_pick.rs
x11rb = { version = "0.14.0", features = ["randr", "xtest"] }
